name: check and release

# Every push and PR: the versions in plugin.json and marketplace.json agree, the plugin validates
# (--strict), and its tests pass.
#
# A push to main whose .claude-plugin/plugin.json version has no vX.Y.Z tag yet also tags that commit
# and publishes a GitHub Release, marked Latest, with notes listing every commit since the previous
# v* tag. Bumping the version is the release trigger: Claude Code only updates an install when the
# version changes, so a push without a bump ships nothing and gets no release.
#
# Values move between steps through files and step outputs, not command substitution, so every
# command here is written out in full.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Versions agree
        run: >-
          jq -e -n
          --slurpfile p .claude-plugin/plugin.json
          --slurpfile m .claude-plugin/marketplace.json
          '$p[0].version == ($m[0].plugins[] | select(.name == "cache-countdown") | .version)'
      - name: Validate
        run: claude plugin validate --strict .
      - name: Test
        run: claude plugin test .

  release:
    name: release a new version
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag and the GitHub Release, both through GH_TOKEN
    steps:
      # fetch-depth: 0 + fetch-tags: the notes are the commits since the previous v* tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Read the version
        id: version
        run: jq -r '"tag=v" + .version' .claude-plugin/plugin.json >> "$GITHUB_OUTPUT"
      - name: Is it new?
        id: new
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already tagged; no new version in this push"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the notes
        if: steps.new.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          git tag --list 'v*' --merged HEAD --sort=-v:refname | head -n 1 > prev.txt
          read -r prev < prev.txt || prev=""
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              echo
              git log --no-merges --pretty='- %s' "$prev..HEAD"
              echo
              echo "**Full changelog**: https://github.com/$REPO/compare/$prev...$TAG"
            else
              echo "## Changes"
              echo
              git log --no-merges --pretty='- %s'
            fi
            echo
            echo "## Install"
            echo
            echo '```'
            echo '/plugin marketplace add jmac122/cache-countdown'
            echo '/plugin install cache-countdown@cache-countdown'
            echo '```'
          } > notes.md
          cat notes.md
      - name: Publish the release
        if: steps.new.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # a re-run that finds the release already made counts as success
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest || gh release view "$TAG" > /dev/null
