name: check and release

# Every push and PR: the versions in plugin.json and marketplace.json agree, the plugin validates
# (--strict), and its tests pass.
#
# A push to main whose .claude-plugin/plugin.json version has no vX.Y.Z tag yet also tags that commit
# and publishes a GitHub Release, marked Latest, with notes listing every commit since the previous
# v* tag. Bumping the version is the release trigger: Claude Code only updates an install when the
# version changes, so a push without a bump ships nothing and gets no release.
#
# The logic runs as plain JavaScript in actions/github-script: no shell, no variables expanded into
# commands. Git is called with fixed argument lists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Versions agree
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'))
            const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'))
            const entry = market.plugins.find(p => p.name === 'cache-countdown')
            if (!entry || entry.version !== plugin.version) {
              core.setFailed('plugin.json is ' + plugin.version + ' but marketplace.json is ' + (entry ? entry.version : 'missing'))
            }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate --strict .
      - name: Test
        run: claude plugin test .

  release:
    name: release a new version
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag and the GitHub Release
    steps:
      # fetch-depth: 0 + fetch-tags: the notes are the commits since the previous v* tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Tag and release a new version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { execFileSync } = require('child_process')
            const git = args => execFileSync('git', args, { encoding: 'utf8' })

            const tag = 'v' + JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8')).version
            const tags = git(['tag', '--list', 'v*', '--merged', 'HEAD', '--sort=-v:refname']).split('\n').filter(Boolean)
            if (tags.includes(tag)) {
              core.info(tag + ' is already tagged; no new version in this push')
              return
            }

            const prev = tags[0]
            const changes = prev
              ? git(['log', '--no-merges', '--pretty=- %s', prev + '..HEAD'])
              : git(['log', '--no-merges', '--pretty=- %s'])
            const repo = context.repo.owner + '/' + context.repo.repo
            const fence = '`'.repeat(3)
            const body = [
              prev ? '## Changes since ' + prev : '## Changes',
              '',
              changes.trim(),
              '',
              prev ? '**Full changelog**: https://github.com/' + repo + '/compare/' + prev + '...' + tag : '',
              '',
              '## Install',
              '',
              fence,
              '/plugin marketplace add jmac122/cache-countdown',
              '/plugin install cache-countdown@cache-countdown',
              fence,
            ].join('\n')
            core.info(body)

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body,
                make_latest: 'true',
              })
            } catch (err) {
              // a re-run that finds the release already made counts as success
              const existing = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag }).catch(() => null)
              if (!existing) throw err
              core.info(tag + ' was released by another run; left as is')
            }
